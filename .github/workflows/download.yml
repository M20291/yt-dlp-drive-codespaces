name: YouTube Video Downloader

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      platform:
        description: 'Platform (youtube/vimeo)'
        required: false
        type: string
        default: 'youtube'
  push:
    paths:
      - 'config.json'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install yt-dlp
        run: |
          pip install yt-dlp
      
      - name: Get video URL from config
        id: get_url
        run: |
          if [ -n "${{ github.event.inputs.video_url }}" ]; then
            VIDEO_URL="${{ github.event.inputs.video_url }}"
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            VIDEO_URL=$(cat config.json | grep -o '"video_url"[^,]*' | cut -d'"' -f4)
            PLALFORM=$(cat config.json | grep -o 'nplatform"[^,]*' | cut -d'"' -f4)
          fi
          
          PLATFORM="${PLATFORM:-youtube}"
          
          echo "video_url=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "platform=$PLALFORM" >> $GITHUB_OUTPUT
          
          echo "Video URL: $VIDEO_URL"
          echo "Platform: $PLALFORM"
      
      - name: Download video metadata
        env:
          VIDEO_URL: "${{ steps.get_url.outputs.video_url }}"
          PLATFORM: "${{ steps.get_url.outputs.platform }}"
        run: |
          echo "=========================================="
          echo "   Starting video metadata download"
          echo "=========================================="
          echo "Platform: $PLALFORM"
          echo "Video URL: $VIDEO_URL"
          echo ""
          
          # Make script executable
          chmod +x download_metadata.sh
          
          # Run the metadata download script with error handling
           bash download_metadata.sh || {
              echo "Script failed"
              exit 1
          }
          
          # List files to see what was created
          ls -la
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f video_metadata.json ]; then
            git add video_metadata.json
            git diff --staged --quiet || git commit -m "Update video metadata [skip ci]"
            git push
          fi
