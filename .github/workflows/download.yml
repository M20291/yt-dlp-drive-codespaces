name: YouTube Video Downloader

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      platform:
        description: 'Platform (youtube/vimeo)'
        required: false
        type: string
        default: 'youtube'
  push:
    paths:
      - 'config.json'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install yt-dlp
        run: |
          pip install yt-dlp
      
      - name: Get video URL from config
        id: get_url
        run: |
          if [ -n "${{ github.event.inputs.video_url }}" ]; then
            VIDEO_URL="${{ github.event.inputs.video_url }}"
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            VIDEO_URL=$(cat config.json | grep -o '"video_url"[^,]*' | cut -d'"' -f4)
            PLATFORM=$(cat config.json | grep -o '"platform"[^,]*' | cut -d'"' -f4)
          fi
          
          PLATFORM="${PLATFORM:-youtube}"
          
          echo "video_url=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          
          echo "Video URL: $VIDEO_URL"
          echo "Platform: $PLATFORM"
      
      - name: Download video metadata
        run: |
          VIDEO_URL="${{ steps.get_url.outputs.video_url }}"
          PLATFORM="${{ steps.get_url.outputs.platform }}"
          
          echo "=========================================="
          echo "   Starting video metadata download"
          echo "=========================================="
          echo "Platform: $PLATFORM"
          echo "Video URL: $VIDEO_URL"
          echo ""
          
          # Get video metadata only (no download)
          echo "Getting video metadata..."
          python3 -m yt_dlp --dump-json "$VIDEO_URL" > video_metadata.json
          
          # Extract basic info
          TITLE=$(python3 -c "import json; data=json.load(open('video_metadata.json')); print(data.get('title', 'Unknown'))")
          DURATION=$(python3 -c "import json; data=json.load(open('video_metadata.json')); print(data.get('duration', 'Unknown'))")
          VIEW_COUNT=$(python3 -c "import json; data=json.load(open('video_metadata.json')); print(data.get('view_count', 'Unknown'))")
          
          echo "Title: $TITLE"
          echo "Duration: $DURATION seconds"
          echo "View count: $VIEW_COUNT"
          
          # Create results JSON
          cat > download_results.json << EOF
{
  "success": true,
  "platform": "$PLATFORM",
  "video_url": "$VIDEO_URL",
  "video_title": "$TITLE",
  "duration": $DURATION,
  "view_count": $VIEW_COUNT,
  "timestamp": "$(date -Iseconds)",
  "note": "Metadata only - no actual download (GitHub Actions size limit)"
}
EOF
          
          echo "Results saved to download_results.json"
          cat download_results.json
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add download_results.json
          git diff --staged --quiet || git commit -m "Update download results [skip ci]"
          git push
