name: YouTube Video Downloader

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      platform:
        description: 'Platform (youtube/vimeo)'
        required: false
        type: string
        default: 'youtube'
  push:
    paths:
      - 'config.json'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Simple test
        run: |
          echo "Testing GitHub Action"
          echo "Timestamp: $(date)" > test_output.txt
          cat test_output.txt
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test_output.txt
          git diff --staged --quiet || git commit -m "Test action run [skip ci]"
          git push
